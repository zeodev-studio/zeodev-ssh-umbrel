name: Build and publish ZeoDev SSH image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt pytest pytest-asyncio httpx
      - name: Backend tests
        run: |
          cd src
          python -m pytest -q tests
      - name: JavaScript syntax
        run: node --check src/app/static/app.js
      - name: Python syntax
        run: python -m compileall -q src/app

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/zeodev-studio/zeodev-ssh-umbrel:0.1.1
