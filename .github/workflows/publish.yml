name: Build and publish ZeoDev SSH image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'zeodev-ssh/umbrel-app.yml'
      - 'zeodev-ssh/docker-compose.yml'
      - 'zeodev-ssh/gallery/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r src/requirements.txt pytest pyyaml
      - name: Check release metadata and dependencies
        run: |
          python - <<'PY_RELEASE'
          import pathlib, yaml
          root = pathlib.Path('.')
          app = yaml.safe_load((root/'zeodev-ssh/umbrel-app.yml').read_text())
          compose = yaml.safe_load((root/'zeodev-ssh/docker-compose.yml').read_text())
          expected = 'ghcr.io/zeodev-studio/zeodev-ssh-umbrel:' + app['version']
          assert compose['services']['web']['image'] == expected, 'Manifest and image versions do not match'
          for item in app['gallery']:
              assert item.startswith('https://raw.githubusercontent.com/zeodev-studio/zeodev-ssh-umbrel/main/'), 'Gallery image needs a public GitHub URL'
          assert app['port'] == 8164
          print('Release metadata OK:', app['version'])
          PY_RELEASE
      - name: Verify listing images are committed
        run: |
          python - <<'PY_ASSETS'
          from pathlib import Path
          import yaml
          repo=Path('.')
          manifest=yaml.safe_load((repo/'zeodev-ssh/umbrel-app.yml').read_text())
          base='https://raw.githubusercontent.com/zeodev-studio/zeodev-ssh-umbrel/main/'
          for url in [manifest['icon'], *manifest.get('gallery',[])]:
              assert url.startswith(base), f'Image must be hosted in this public repository: {url}'
              asset=repo/url[len(base):]
              assert asset.is_file(), f'Missing listing image: {asset}'
              assert asset.stat().st_size > 100, f'Empty listing image: {asset}'
          assert manifest['id']=='zeodev-ssh'
          print('Icon and gallery validated')
          PY_ASSETS
      - name: Test API and discovery
        working-directory: src
        run: python -m pytest tests -q
      - name: Check Python syntax
        run: python -m compileall -q src/app

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish AMD64/ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/zeodev-studio/zeodev-ssh-umbrel:0.1.2
          labels: |
            org.opencontainers.image.title=ZeoDev SSH
            org.opencontainers.image.description=Self-hosted SSH connection manager for Umbrel
            org.opencontainers.image.source=https://github.com/zeodev-studio/zeodev-ssh-umbrel
            org.opencontainers.image.version=0.1.2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifest contains both architectures
        run: |
          docker buildx imagetools inspect ghcr.io/zeodev-studio/zeodev-ssh-umbrel:0.1.2 | tee /tmp/zeodev-image-manifest.txt
          grep -q 'linux/amd64' /tmp/zeodev-image-manifest.txt
          grep -q 'linux/arm64' /tmp/zeodev-image-manifest.txt
      - name: Smoke-test released container
        run: |
          docker pull ghcr.io/zeodev-studio/zeodev-ssh-umbrel:0.1.2
          docker volume create zeodev_ssh_ci_data
          docker run -d --name zeodev-ssh-ci \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -e ZEODEV_DATA_DIR=/data -e ZEODEV_ALLOW_WEB_SETUP=true \
            -v zeodev_ssh_ci_data:/data \
            -p 127.0.0.1:18080:8080 \
            ghcr.io/zeodev-studio/zeodev-ssh-umbrel:0.1.2
          for attempt in $(seq 1 25); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs zeodev-ssh-ci
          exit 1
      - name: Clean up smoke-test container
        if: always()
        run: |
          docker rm -f zeodev-ssh-ci 2>/dev/null || true
          docker volume rm zeodev_ssh_ci_data 2>/dev/null || true
